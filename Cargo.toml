[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/XeS0r/pwk-cli"

[workspace.dependencies]
# Internal crates. See docs/design.md for the allowed dependency edges.
pwk-api = { path = "crates/api" }
pwk-crypto = { path = "crates/crypto" }

aes = "0.8"
aes-gcm = "0.10"
anyhow = "1.0"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.2"
hmac = "0.12"
md-5 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
percent-encoding = "2.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rpassword = "7.3"
rsa = { version = "0.9", features = ["sha2", "pem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
url = "2.5"
zeroize = { version = "1.8", features = ["derive"] }

# Tests.
assert_cmd = "2.0"
mockito = "1.6"
predicates = "3.1"
tempfile = "3.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

# PBKDF2 (100 000+ iterations, the minimum pwk accepts) is far too slow unoptimized; the
# e2e tests unlock many times. Optimize the hashing crates in dev/test builds, and
# pwk-crypto, where the generic PBKDF2-HMAC-SHA code is instantiated (debug e2e run:
# ~30 s unoptimized, ~4 s with this).
[profile.dev.package.pwk-crypto]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3
