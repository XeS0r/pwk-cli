# Everything `just check` runs: build, tests, clippy (Linux + macOS), rustfmt,
# Markdown, the changelog, local links, the dependency audit and the release package.
#
# Two jobs with the same steps, because permissions cannot depend on the event: pull
# requests only restore the Nix store and run with a read-only token; pushes to main
# also save it and delete outdated caches, which needs `actions: write`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A new push to a pull request cancels its running check; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Rust toolchain for three targets, two musl cross compilers and the
      # builds of the workspace fill the runner's 14 GB quickly.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: cachix/install-nix-action@v31

      # Restores what main has built; saves nothing.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - run: nix flake check -L

  check-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # Lets cache-nix-action delete outdated caches (10 GB per repository).
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # As in `check`.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: cachix/install-nix-action@v31

      # Keeps the Nix store between runs, so later runs only rebuild what
      # changed. Keyed on everything that decides what gets built.
      - name: Restore and save the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      - run: nix flake check -L
