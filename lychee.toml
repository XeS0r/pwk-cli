# Link check for the Markdown files (`nix run .#links`, `just links`, the links
# workflow; `checks.links` runs it with `--offline`). The inputs are given by the
# app, together with a remap that checks links to this repository's main branch
# against the working tree.

# Fragments: `#anchor` in local files and in fetched pages (lychee 0.24 wants a
# mode here; "anchor-only" is what `true` meant before).
include_fragments = "anchor-only"
# No `.lycheecache`: every run checks everything again.
cache = false
no_progress = true

timeout = 20
max_retries = 3
retry_wait_time = 2
max_concurrency = 16
# 429: rate limited (mostly GitHub); the link existed, it was only not served.
accept = ["200..=299", "429"]

# Generated files that are not part of the repository.
exclude_path = [
  '(^|/)target/',
  '(^|/)result(-[^/]*)?/',
  '(^|/)\.direnv/',
]

exclude_loopback = true
exclude = [
  # Placeholder hosts in the examples.
  '^https?://([^/]+\.)?example\.(com|org|net)([/:]|$)',
  # Keep a Changelog links of this repository. The newest one names the tag of the
  # version being released, and the release workflow creates that tag only after
  # the commit is on main, so the push of the release commit would always fail.
  '^https://github\.com/XeS0r/pwk-cli/compare/v[0-9][0-9A-Za-z.+-]*\.\.\.(HEAD|v[0-9][0-9A-Za-z.+-]*)$',
  '^https://github\.com/XeS0r/pwk-cli/releases/tag/v[0-9][0-9A-Za-z.+-]*$',
  # passwork.pro answers automated requests with 403 Forbidden; the pages exist.
  '^https://passwork\.pro/',
  # 404 until the first release is published.
  '^https://github\.com/XeS0r/pwk-cli/releases/latest$',
]
